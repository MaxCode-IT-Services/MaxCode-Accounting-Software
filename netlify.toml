[build]
  command = "cd maxcode-invoice-software && npm install && npm run build && cd ../backend && npm install"
  publish = "maxcode-invoice-software/dist"
  functions = "backend/netlify/functions"
  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"
  # Increase function timeout for backup/restore operations (max 26s on free tier)
  included_files = []

# ── Edge Functions ─────────────────────────────────────────────────────────────
# payment-link-og: injects dynamic Open Graph meta tags for WhatsApp / Telegram
# / Facebook link previews. Only activates for bot/crawler User-Agents.
[[edge_functions]]
  function = "payment-link-og"
  path = "/*"

[dev]
  command = "npm run dev"
  port = 5173
  targetPort = 5173
  functions = "backend/netlify/functions"
  framework = "#custom"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
