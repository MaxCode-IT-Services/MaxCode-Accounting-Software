name: Auto Backup - Every 4 Hours

on:
  # schedule:
  #   # Run every 4 hours (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
  #   - cron: "0 */4 * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  backup:
    name: Every 4 Hours Backup to Google Drive
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm install axios googleapis dotenv

      - name: Run Backup Script
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          NETLIFY_API_URL: ${{ secrets.NETLIFY_API_URL }}
          BACKUP_API_KEY: ${{ secrets.BACKUP_API_KEY }}
          BACKUP_FREQUENCY: "every_4_hours"
        run: node scripts/auto-backup.js

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hourly-backup-${{ github.run_number }}
          path: backup-*.json
          retention-days: 2

      - name: Notify on Success
        if: success()
        run: echo "✅ Every 4 hours backup completed successfully at $(date)"

      - name: Notify on Failure
        if: failure()
        run: echo "❌ Every 4 hours backup failed at $(date)"
