  <style>
    :root {
      --maxcode-primary: #09a98d;
      --maxcode-primary-hover: #007026;
      --primary-gradient: linear-gradient(135deg, #4f46e5, #7c3aed);
      --header-gradient: linear-gradient(135deg, #007026 0, #09a98d 100%);
    }
    body {
      background-color: #fff;
    }
    .modern-input {
      border: 2px solid #e9ecef;
      border-radius: 10px;
      padding: 12px 15px;
      transition: all 0.3s ease;
      background: white;
    }

    .modern-input:focus {
      border-color: var(--maxcode-primary-hover);
      box-shadow: 0 0 0 0.2rem rgba(13, 253, 33, 0.25);
    }

    .modern-input:disabled {
      background-color: #f8f9fa;
      border-color: #dee2e6;
      color: #6c757d;
    }

    .disabled-input {
      background-color: #f8f9fa !important;
      border-color: #dee2e6 !important;
      color: #6c757d !important;
    }

    .form-label {
      font-weight: 600;
      color: #495057;
      margin-bottom: 0.5rem;
    }
    .btn-primary,
    .btn-primary:hover {
      background: var(--header-gradient);
      color: white;
      border: none;
    }
    .btn-success,
    .btn-success:hover {
      background: var(--header-gradient);
      color: white;
      border: none;
    }
    .btn-danger,
    .btn-danger:hover {
      background: #ef4444;
      color: white;
      border: none;
    }
    .btn-light,
    .btn-light:hover {
      background: var(--header-gradient);
      color: #475569;
      border: none;
    }
  </style>
