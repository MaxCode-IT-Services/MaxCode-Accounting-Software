  <style>
    :root {
      --maxcode-primary: #09a98d;
      --maxcode-primary-hover: #007026;
      --primary-gradient: linear-gradient(135deg, #4f46e5, #7c3aed);
      --header-gradient: linear-gradient(135deg, #007026 0, #09a98d 100%);
    }
    body {
      background-color: #fff;
    }
    .modern-input {
      border: 2px solid #e9ecef;
      border-radius: 10px;
      padding: 12px 15px;
      transition: all 0.3s ease;
      background: white;
    }

    .modern-input:focus {
      border-color: var(--maxcode-primary-hover);
    }

    .modern-input:disabled {
      background-color: #f8f9fa;
      border-color: #dee2e6;
      color: #6c757d;
    }

    /* Ensure form-select dropdown icon is visible with modern-input */
    .form-select.modern-input {
      padding-right: 1.125rem;
      background-position: right 0.75rem center;
      background-size: 16px 12px;
      background-repeat: no-repeat;
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23343a40' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M2 5l6 6 6-6'/%3e%3c/svg%3e");
    }

    .disabled-input {
      background-color: #f8f9fa !important;
      border-color: #dee2e6 !important;
      color: #6c757d !important;
    }

    .form-label {
      font-weight: 600;
      color: #495057;
      margin-bottom: 0.5rem;
    }
    .btn-primary,
    .btn-primary:hover {
      background: var(--header-gradient);
      color: white;
      border: none;
    }
    .btn-success,
    .btn-success:hover {
      background: var(--header-gradient);
      color: white;
      border: none;
    }
    .btn-danger,
    .btn-danger:hover {
      background: #ef4444;
      color: white;
      border: none;
    }
    .btn-light,
    .btn-light:hover {
      background: var(--header-gradient);
      color: #475569;
      border: none;
    }

    /* Initial Loading Screen */
    #initial-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #007026 0%, #09a98d 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.3s ease-out;
    }

    #initial-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-content {
      text-align: center;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 5px solid rgba(255, 255, 255, 0.2);
      border-top: 5px solid #ffffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .loader-text {
      color: white;
      font-size: 18px;
      font-weight: 600;
      margin-top: 20px;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
        Arial, sans-serif;
    }

    .loader-subtext {
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      margin-top: 8px;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
        Arial, sans-serif;
    }
  </style>
  <body>
    <!-- Initial Loading Screen -->
    <div id="initial-loader">

        <div class="spinner"></div>
        <div class="loader-text">MaxCode Billing</div>
        <div class="loader-subtext">Loading Application...</div>
